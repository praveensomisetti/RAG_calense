# Golden evaluation set. Expected *values* come from evals/ground_truth.py (raw-CSV pandas);
# this file holds the question, the expected behaviour and the expected canonical entities.
#   type:      expected response_type (answer | clarification | refusal | no_data)
#   intents:   expected intent per sub-question
#   entities:  canonical display names the resolver must produce (subset match)
#   must_warn: warning codes that must be present
- id: cas_acetaldehyde
